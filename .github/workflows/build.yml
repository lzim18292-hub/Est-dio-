name: Build Luau Studio Android

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APK ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -e

          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip }}" -d source

          echo "Conteúdo extraído:"
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -e

          GRADLE_DIR="$(find source -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)"

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERRO: não encontrei settings.gradle ou settings.gradle.kts."
            echo ""
            echo "Estrutura encontrada:"
            find source -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_DIR")"

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;27.3.13750724"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build ARM64 APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          ANDROID_ABI: arm64-v8a
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            echo "ERRO: gradlew não encontrado."
            echo "O projeto precisa conter um Gradle wrapper."
            exit 1
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find source -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado após o build."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp "${{ steps.apk.outputs.apk }}" \
            "$GITHUB_WORKSPACE/LuauStudioAndroid-debug-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuauStudioAndroid-debug-arm64
          path: LuauStudioAndroid-debug-arm64.apk
          if-no-files-found: error
          retention-days: 30
