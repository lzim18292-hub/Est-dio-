name: Build Luau Studio Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encontrar ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado na raiz."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip }}" -d source

          echo "Conteúdo inicial:"
          find source -maxdepth 3 -type f | sort | head -200

      - name: Localizar projeto Gradle
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find source -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find source -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Gradle encontrado em:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;27.3.13750724"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Gerar Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Gerando Gradle Wrapper..."

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

          chmod +x gradlew

          echo "Wrapper criado:"
          ls -la gradlew
          find gradle -maxdepth 3 -type f -print

      - name: Verificar projeto
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=== SETTINGS ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts

          echo ""
          echo "=== PROJETO ==="
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Procurar APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find . -type f | sort
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Copiar APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "${{ steps.apk.outputs.apk }}" \
             "$GITHUB_WORKSPACE/output/LuauStudioAndroid-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/output/LuauStudioAndroid-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuauStudioAndroid-debug
          path: output/LuauStudioAndroid-debug.apk
          if-no-files-found: error

      - name: Relatório final
        shell: bash
        run: |
          echo "=========================================="
          echo " BUILD CONCLUÍDO"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh output/LuauStudioAndroid-debug.apk
          echo ""
          echo "Artefato: LuauStudioAndroid-debug"
