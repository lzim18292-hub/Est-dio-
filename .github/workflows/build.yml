name: Build Luau Studio Android

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APK ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encontrar ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado na raiz."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip }}" -d source

          echo "Projeto extraído."
          echo ""
          find source -maxdepth 3 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # IMPORTANTE:
      # Não usar setup-android@v3.
      # A versão antiga tenta instalar o pacote removido "tools".
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;27.3.13750724"

      - name: Localizar projeto Gradle
        id: gradle
        shell: bash
        run: |
          set -e

          SETTINGS="$(find source \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
            \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: não encontrei settings.gradle."
            echo ""
            echo "Arquivos encontrados:"
            find source -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar Gradle Wrapper
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERRO: gradlew não encontrado."
            echo ""
            echo "Conteúdo:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version

      - name: Build ARM64 Debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        env:
          ANDROID_ABI: arm64-v8a
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Procurar APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          APK="$(find source \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "APK ENCONTRADO"
          echo "================================"
          ls -lh "$APK"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          cp \
            "${{ steps.apk.outputs.apk }}" \
            "$GITHUB_WORKSPACE/LuauStudioAndroid-debug-arm64.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/LuauStudioAndroid-debug-arm64.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuauStudioAndroid-debug-arm64
          path: LuauStudioAndroid-debug-arm64.apk
          if-no-files-found: error
          retention-days: 30
